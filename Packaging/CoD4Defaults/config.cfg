// Clean graphics defaults. The launcher supplies the selected display resolution.
seta r_fullscreen "1"
seta r_aaSamples "4"
seta r_aaAlpha "supersample (nice)"
seta r_texFilterAnisoMin "16"
seta r_texFilterAnisoMax "16"
seta r_texFilterMipMode "Force Trilinear"
seta r_picmip_manual "1"
seta r_picmip "0"
seta r_picmip_bump "0"
seta r_picmip_spec "0"
seta r_picmip_water "0"
seta r_lodBiasRigid "0"
seta r_lodBiasSkinned "0"
seta r_lodScaleRigid "1"
seta r_lodScaleSkinned "1"
seta sm_enable "1"
seta sm_maxLights "4"
seta r_distortion "1"
seta r_dof_enable "1"
seta r_glow_allowed "1"
seta r_specular "1"
seta r_drawDecals "1"
seta r_drawSun "1"
seta r_drawWater "1"
seta r_inGameVideo "1"
seta r_vsync "0"
seta com_maxfps "0"
seta cg_drawFPS "Off"
