# Far Cry 2 (Dunia, Direct3D 9). Preserve every draw and use the selected native render resolution.
# Far Cry 2 picks its foliage alpha test by GPU vendor; reporting NVIDIA makes leaves cut out under MSAA.
# The starter rewrites the renderer keys it manages.
shader.asyncCompile = false
render.scale = 1
present.maxFps = 0
adapter.spoof = nvidia
