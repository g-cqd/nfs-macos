# Far Cry 2 (Dunia engine, Direct3D 9) renderer settings for mtld3d, which translates Direct3D 9 to Metal.
#
# mtld3d reads this file from the folder of FarCry2.exe (bin) when the game creates its Direct3D 9
# interface, so a change needs a game restart. Lines starting with # are comments; mtld3d ignores an
# unknown key with a warning, so a misspelled key does nothing.
#
# The starter rewrites only render.scale, shader.asyncCompile and present.maxFps (Graphics, Renderer)
# when you save or play. Every other line and every comment here is kept, and an app update keeps your
# copy of this file.
#
# Evidence labels used below:
#   [mtld3d]      what mtld3d's own documentation says about the key, at the pinned renderer build.
#   [CoD4]        the same choice the Call of Duty 4 recipe ships (Packaging/CoD4Defaults/mtld3d.conf).
#   [unverified]  nothing shows it for Far Cry 2: no game session of this app has measured it.

# Keep every draw while a shader or pipeline compiles, instead of leaving some out of the frame.
#
# mtld3d builds first-use shaders and pipelines on four worker threads either way. With true (mtld3d's
# default), a draw whose build is still running is left out of its frame when every target it draws
# into is rebuilt each frame, and appears a frame or two later: geometry, foliage or effects can be
# missing for a moment. With false, every draw is kept and the frame waits for the builds it needs, so
# first use can pause but nothing is dropped. [mtld3d]
#
# false is chosen because a missing draw is a wrong picture and a pause is not. The Call of Duty 4
# recipe and mtld3d's built-in Morrowind profile make the same choice. [CoD4] [mtld3d]
# Whether the pauses are acceptable in Far Cry 2 is [unverified]; the cache below is what shortens
# them. Switch it to true under Graphics, Renderer if pauses bother you more than missing draws.
shader.asyncCompile = false

# Keep the shader and pipeline cache between launches.
#
# With true (mtld3d's default), mtld3d recreates every recorded shader library and pipeline before the
# first frame, so combinations from earlier sessions are not compiled again while you play. New ones
# compile on first use and are saved. The cost is a longer start-up that grows with the cache. [mtld3d]
# The starter stores the file outside the app and the game copy, one folder per renderer build under
# ~/Library/Application Support/FarCry2Mac/ShaderCache, and puts it into bin before each launch. A
# renderer update starts an empty cache instead of loading an old one. The pause on the first launch
# and the start-up time with a full cache are [unverified] for Far Cry 2.
# false turns the cache off: every launch compiles everything again, and nothing is saved.
shaderCache.enable = true

# Render at the selected resolution (1) or at a fraction of it with MetalFX spatial upscaling.
#
# 1 renders at full resolution and changes nothing. A lower value rasterizes a smaller grid and
# MetalFX upscales it, which trades detail (the interface is scaled too) for speed. Targets the size of
# the back buffer scale with it; shadow maps and other sizes keep what the game chose. A GPU without
# MetalFX support ignores the value. [mtld3d] [CoD4]
# How Far Cry 2's post-processing targets behave under a lower value is [unverified].
render.scale = 1

# Frame-rate ceiling in Hz; 0 leaves the frame rate to the game's own vertical sync setting. [mtld3d]
# Public reports mention a tutorial cutscene problem at high frame rates, so 30 or 60 is the fallback
# to try if one appears. That is [unverified].
present.maxFps = 0

# Video memory the game is told it has (MiB). Not set here, so mtld3d's default applies: 1024 for a
# 32-bit game such as FarCry2.exe, because an engine of this era sizes its texture pools from this
# number and a 32-bit process runs out of address space long before a Mac runs out of memory. [mtld3d]
# Whether 1024 suits Far Cry 2's texture streaming is [unverified]; raise it only after a session
# shows textures or geometry missing at the default.
# memory.vramBudgetMB = 1024

# Performance telemetry is not a setting of this file. The starter's launch environment sets
# RUST_LOG=warn,mtld3d::perf=off for every game, which turns the renderer's performance telemetry off
# at run time. Whether a renderer build compiles telemetry in is decided when mtld3d is built.
